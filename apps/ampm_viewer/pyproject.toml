[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ampm-viewer"
# The version lives in src/ampm_viewer/__init__.py (__version__), the one
# place to change it; the app shows it in Help and in crash reports.
dynamic = ["version"]
description = "AMPM plotting application within the OHPAL ecosystem"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Oliver H. Page", email = "oliverhpage@gmail.com"},
]
license = {text = "All rights reserved"}
dependencies = [
    "ohpal-ampm",
    "ohpal-samples",
    "PyQt6>=6.5,<7",
    "vispy>=0.14,<1",
    "numpy>=1.24",
]

[dependency-groups]
dev = ["pyinstaller>=6.21,<7", "pytest>=8,<10", "pytest-xdist>=3.6,<4"]

[project.gui-scripts]
ampm-viewer = "ampm_viewer:main"

[tool.setuptools.dynamic]
version = {attr = "ampm_viewer.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ampm_viewer = ["assets/*"]
"ampm_viewer.shell" = ["assets/icons/carbon/*.svg", "assets/icons/carbon/LICENSE", "assets/icons/custom/*.svg", "assets/fonts/*.ttf", "assets/fonts/LICENSE", "assets/help/*.md"]

[tool.uv.sources]
ohpal-ampm = { workspace = true }
ohpal-samples = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
